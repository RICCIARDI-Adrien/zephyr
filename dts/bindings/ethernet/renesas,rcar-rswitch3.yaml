description: Renesas R-Car R-Switch 3 Ethernet

compatible: "renesas,rcar-rswitch3"

include: ethernet-controller.yaml

properties:
  reg:
    required: true

  ports:
    type: array

child-binding:
  child-binding:

    description: Port properties

    properties:
      # TODO
      id:
        type: int

      phy-handle:
        type: phandle
        description: Specify a reference to a node representing a PHY device.

      local-mac-address:
        type: uint8-array
        description: Specify the MAC address that is assigned to the Ethernet controller port.

    # TODO
