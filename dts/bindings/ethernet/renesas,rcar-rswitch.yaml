description: Renesas R-Car R-Switch Ethernet

compatible: "renesas,rcar-rswitch"

include: ethernet-controller.yaml

properties:
  reg:
    required: true

  coma-reg-offset:
    type: int
    required: true
    description: |
      The COMA registers offset from the beginning of the R-Switch 3 secure range.
      Also called CARO offset in the TOP documentation.

  ports:
    type: array

child-binding:
  #child-binding:

  description: Port properties

  include: ethernet-mac-address.yaml


  properties:
    # TODO
    #id:
    #  type: int

    phy-handle:
      type: phandle
      description: Specify a reference to a node representing a PHY device.

    lsocal-mac-address:
      type: uint8-array
      description: Specify the MAC address that is assigned to the Ethernet controller port.

