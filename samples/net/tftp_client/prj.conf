CONFIG_NETWORKING=y
CONFIG_LOG=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=10
CONFIG_NET_MAX_CONTEXTS=2

CONFIG_NET_LOG=y
CONFIG_NET_SHELL=y

CONFIG_NET_CONFIG_SETTINGS=y
#CONFIG_NET_CONFIG_NEED_IPV6=n
#CONFIG_NET_CONFIG_MY_IPV6_ADDR="2001:db8::1"
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.10"

CONFIG_DNS_RESOLVER=n
CONFIG_TFTP_LIB=y
CONFIG_POSIX_API=y

CONFIG_MAIN_STACK_SIZE=2048

# TEST
CONFIG_ARM_SCMI_POLLING_ONLY=y
CONFIG_PINCTRL_RCAR_SCMI=n
CONFIG_PM_DEVICE=y

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ETH_DRIVER=y
CONFIG_ETHERNET_LOG_LEVEL_DBG=y
CONFIG_NET_IF_MAX_IPV4_COUNT=6
